[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-document-service"
version = "0.1.0"
description = "Small local PDF indexing and semantic search service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed>=0.6,<1",
  "numpy>=1.26,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/doc_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
